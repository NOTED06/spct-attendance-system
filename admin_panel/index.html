<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance Monitoring System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-circle">
                    <img src="images/spct-logo.png" alt="SPCT" class="logo-img">
                </div>
                <h1>Attendance Monitoring</h1>
                <p>St. Peter's College of Toril</p>
                <span class="subtitle">Admin Panel</span>
            </div>

            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <span class="material-icons input-icon">email</span>
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="form-group">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="material-icons toggle-password" onclick="togglePassword()">visibility_off</span>
                </div>

                <a href="#" class="forgot-link" onclick="resetPassword()">Forgot Password?</a>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span> Signing in...
                    </span>
                </button>

                <div id="loginError" class="error-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
